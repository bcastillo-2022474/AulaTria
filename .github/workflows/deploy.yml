name: deploy

# Ships master to Railway: ONE service (`app`: the API + Caddy serving both web builds) next to Postgres.
# Needs the repository secret RAILWAY_TOKEN: a PROJECT token (Railway project -> Settings -> Tokens, environment production).
# Optional repository variable TEACHER_HOST (default aulatria.sudoersgt.dev) is baked into the web builds.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: "${{ secrets.RAILWAY_TOKEN }}"
      TEACHER_HOST: "${{ vars.TEACHER_HOST }}"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: go run github.com/magefile/mage deploy:bundle deploy:stage
      - run: npm i -g @railway/cli
      # Uploads only the assembled context (.deploy/app), not the repository. The container applies migrations on start.
      - run: railway up --ci --service app
        working-directory: .deploy/app
