services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aula          # owner / migrations / seed
      POSTGRES_PASSWORD: aula
      POSTGRES_DB: aula
    ports: ["5440:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aula"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
