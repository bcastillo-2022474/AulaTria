syntax = "proto3";

package aula.attendance.v1;

import "aula/options/v1/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

enum AttendanceRoundStatus {
  ATTENDANCE_ROUND_STATUS_UNSPECIFIED = 0;
  ATTENDANCE_ROUND_STATUS_OPEN = 1;
  ATTENDANCE_ROUND_STATUS_CLOSED = 2;
}

enum AttendanceStatus {
  ATTENDANCE_STATUS_UNSPECIFIED = 0;
  ATTENDANCE_STATUS_PRESENT = 1;
  ATTENDANCE_STATUS_NEEDS_REVIEW = 2;
  ATTENDANCE_STATUS_ABSENT = 3;
}

enum ReviewReason {
  REVIEW_REASON_UNSPECIFIED = 0;
  REVIEW_REASON_TOO_FAR = 1;      // "Escaneo a unos 120 m del aula"
  REVIEW_REASON_NO_LOCATION = 2;  // "Sin permiso de ubicacion"
  REVIEW_REASON_LOW_ACCURACY = 3;
}

message ReviewItem {
  string student_id = 1;
  string name = 2;
  ReviewReason reason = 3;
  int32 distance_m = 4; // 0 = unknown
  AttendanceStatus status = 5; // NEEDS_REVIEW until the teacher decides
}

message AttendanceRound {
  string id = 1;
  string lesson_id = 2;
  AttendanceRoundStatus status = 3;
  int32 present_count = 4;
  int32 enrolled_count = 5;
  int32 in_room_count = 6;
  repeated ReviewItem review = 7;
}

// Opens attendance. lat/lng = where the TEACHER is: it is the center of the allowed area (radius 50 m by
// default). It is required for location validation; has_location=false opens a round that judges by code only
// (every scan then lands as NEEDS_REVIEW / NO_LOCATION, so the teacher reviews them).
message OpenAttendanceRoundRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  bool has_location = 2;
  double lat = 3;
  double lng = 4;
}
message OpenAttendanceRoundResponse {
  AttendanceRound round = 1;
}

// The two ways to prove you are in the room, both shown on the teacher's screen:
//   - qr_code: the QR payload, rotates fast (every 8 s) so a photo of the screen is useless.
//   - manual_code: a short code a student can TYPE when the camera cannot be used (a few characters,
//     rotates slowly: every ~30 s, and the previous one is still accepted for one step so nobody loses a
//     race while typing). CheckIn accepts either.
message GetAttendanceCodesRequest {
  string round_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetAttendanceCodesResponse {
  string qr_code = 1;
  google.protobuf.Timestamp qr_expires_at = 2;
  string manual_code = 3;               // e.g. "K7M2QX"
  google.protobuf.Timestamp manual_expires_at = 4;
}

message GetAttendanceRoundRequest {
  string round_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetAttendanceRoundResponse {
  AttendanceRound round = 1;
}

// A scan OR a typed code (`code` is either one). The LOCATION is what proves the student is in the room:
//   - inside the round's radius                      -> PRESENT
//   - outside the radius (distance_m is recorded)    -> NEEDS_REVIEW / TOO_FAR
//   - no location permission or too imprecise        -> NEEDS_REVIEW / NO_LOCATION or LOW_ACCURACY
// Those are VALID outcomes, not errors: the student lands on "Por revisar" with the attendance recorded and
// the teacher decides. ATTENDANCE_QR_INVALID is only for a wrong or expired code.
// Distance is computed on the SERVER from lat/lng (haversine), never trusted from the client.
message CheckInRequest {
  string round_id = 1 [(buf.validate.field).string.uuid = true];
  string code = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  bool has_location = 3;
  double lat = 4;
  double lng = 5;
  int32 accuracy_m = 6;
}
message CheckInResponse {
  AttendanceStatus status = 1; // PRESENT or NEEDS_REVIEW
  ReviewReason reason = 2;
}

message CloseAttendanceRoundRequest {
  string round_id = 1 [(buf.validate.field).string.uuid = true];
}
message CloseAttendanceRoundResponse {
  AttendanceRound round = 1;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ACCEPT = 1;
  DECISION_REJECT = 2;
}
// "Aceptar" / "Ausente".
message ResolveAttendanceRequest {
  string round_id = 1 [(buf.validate.field).string.uuid = true];
  string student_id = 2 [(buf.validate.field).string.uuid = true];
  Decision decision = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}
message ResolveAttendanceResponse {
  AttendanceRound round = 1;
}

service AttendanceService {
  // teacher
  rpc OpenAttendanceRound(OpenAttendanceRoundRequest) returns (OpenAttendanceRoundResponse) {
    option (aula.options.v1.invalidates) = "GetLessonSnapshot";
    option (aula.options.v1.screens) = "Docente-Live (Tomar asistencia)";
  }
  // teacher
  rpc GetAttendanceCodes(GetAttendanceCodesRequest) returns (GetAttendanceCodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (aula.options.v1.refetch_seconds) = 4;
    option (aula.options.v1.screens) = "Docente-Asistencia (QR + the typable code)";
  }
  // teacher
  rpc GetAttendanceRound(GetAttendanceRoundRequest) returns (GetAttendanceRoundResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (aula.options.v1.refetch_seconds) = 3;
    option (aula.options.v1.screens) = "Docente-Asistencia, Docente-AsistCerrada";
  }
  // student
  rpc CheckIn(CheckInRequest) returns (CheckInResponse) {
    option (aula.options.v1.no_invalidation) = true;
    option (aula.options.v1.screens) = "Estudiante-Escanear -> Verificando -> Presente / PorRevisar";
  }
  // teacher
  rpc CloseAttendanceRound(CloseAttendanceRoundRequest) returns (CloseAttendanceRoundResponse) {
    option (aula.options.v1.invalidates) = "GetAttendanceRound";
    option (aula.options.v1.invalidates) = "GetLessonSnapshot";
    option (aula.options.v1.screens) = "Docente-Asistencia (Cerrar asistencia)";
  }
  // teacher
  rpc ResolveAttendance(ResolveAttendanceRequest) returns (ResolveAttendanceResponse) {
    option (aula.options.v1.invalidates) = "GetAttendanceRound";
    option (aula.options.v1.screens) = "Docente-AsistCerrada";
  }
}
